# source .tmux.conf file
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"

# prevent prefix twice
bind C-b send-prefix

# terminal & colors (GNOME Terminal / xterm-256color + true color)
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Claude Code required: allow OSC passthrough (notifications, progress bar)
set -g allow-passthrough on

# Claude Code required: extended key sequences (Shift+Enter newline, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# reduce esc delay to 0 (important for vim/neovim and Claude Code responsiveness)
set -sg escape-time 0

# large scrollback buffer for Claude output
set -g history-limit 50000

# pass focus events to panes (needed by editors and Claude Code)
set -g focus-events on

# auto-renumber windows when one is closed
set -g renumber-windows on

# disable auto-rename so custom window names are preserved
setw -g automatic-rename off

# highlight windows with new activity in status bar
setw -g monitor-activity on
set -g visual-activity on

# status bar refresh every second (accurate clock)
set -g status-interval 1

# vi copypaste mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# keys unbind
unbind-key -T prefix l

# pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# respect directory
bind-key c   new-window      -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"

# clears buffer
bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history

# mouse on — tmux default passes wheel events to apps that request them (e.g. Claude Code fullscreen)
set -g mouse on

# panes
set -g pane-border-style 'bg=colour0,fg=colour238'
set -g pane-active-border-style 'bg=colour0,fg=colour9'

# colors https://jonasjacek.github.io/colors/
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour234,fg=colour15'
set -g status-left ''
set -g status-right '#H %H:%M %d/%m '
setw -g window-status-current-style 'bg=colour238,fg=colour9'
setw -g window-status-current-format ' #I#[fg=colour255]:#[fg=colour15]#W#[fg=colour255]#F '
setw -g window-status-style 'bg=colour234,fg=colour9'
setw -g window-status-format ' #I#[fg=colour255]:#[fg=colour15]#W#[fg=colour255]#F '
setw -g window-status-bell-style 'bg=colour255,fg=colour1'
