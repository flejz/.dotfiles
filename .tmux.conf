# source .tmux.conf file
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"

# prevent prefix twice
bind C-b send-prefix

# terminal & colors (GNOME Terminal / xterm-256color + true color)
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Claude Code required: allow OSC passthrough (notifications, progress bar)
set -g allow-passthrough on

# Claude Code required: extended key sequences (Shift+Enter newline, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# reduce esc delay to 0 (important for vim/neovim and Claude Code responsiveness)
set -sg escape-time 0

# large scrollback buffer for Claude output
set -g history-limit 50000

# pass focus events to panes (needed by editors and Claude Code)
set -g focus-events on

# auto-renumber windows when one is closed
set -g renumber-windows on

# disable auto-rename so custom window names are preserved
setw -g automatic-rename off

# highlight windows with new activity in status bar
setw -g monitor-activity on
# visual-activity off: flag still shows in status bar, but no yellow "Activity in window N" overlay
set -g visual-activity off

# status bar refresh every second (accurate clock)
set -g status-interval 1

# vi copypaste mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# keys unbind
unbind-key -T prefix l

# pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# respect directory
bind-key c   new-window      -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"

# clears buffer
bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history

# mouse on — tmux default passes wheel events to apps that request them (e.g. Claude Code fullscreen)
set -g mouse on

# ============================================================
# EVA-01 THEME   swatches: https://jonasjacek.github.io/colors/
# ============================================================
# Palette (every color below is from this list — swap a number to retune):
#   234 armor black    97  body purple   154 armor lime    208 horn orange
#   193 pale mint      107 olive green
#   177 vivid violet   141 light violet  139 dim violet    60  shadowed violet
#   255/231 white      249 light grey    0   terminal black
#
# What the colors MEAN (state hierarchy, loudest to quietest):
#   purple block (97 bg)  = current window — lime index, white name, bold
#   lime window NAME      = activity you haven't looked at. Identical to an idle row
#                           in every other respect — only #W flips 255 -> 154
#   orange (208) + bold   = window rang the bell
#   violet (177) + white  = idle window, readable but recedes
#
# Retune knobs:
#   idle too dim/bright?  -> 177 (index) and 255 (name) in window-status-format's ELSE branch
#   activity too loud?    -> 154 in the THEN branch of the same line
#   IMPORTANT: window-status-format is one #{?...} conditional. Do NOT reflow it or
#   add commas outside the existing #[...] blocks — tmux's parser splits on commas
#   and the branches will silently break. Change numbers in place only.

# panes — active border lime, inactive fades into the background
set -g pane-border-style 'bg=colour0,fg=colour60'
set -g pane-active-border-style 'bg=colour0,fg=colour154'

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour234,fg=colour139'
set -g status-left ''
# right side: hostname / clock (lime, the one live element) / date
set -g status-right '#[fg=colour141]#H #[fg=colour154]%H:%M #[fg=colour139]%d/%m '

# current window: purple block, lime index + separators, white name
setw -g window-status-current-style 'bg=colour97,fg=colour154,bold'
setw -g window-status-current-format ' #I#[fg=colour154]:#[fg=colour231]#W#[fg=colour154]#F '

# other windows: THEN branch = activity (lime name), ELSE branch = idle (white name)
setw -g window-status-style 'bg=colour234,fg=colour177'
# MUST be set explicitly: tmux defaults window-status-activity-style to `reverse`, which
# flips fg/bg on top of the format below — every color turns into a block with black text.
setw -g window-status-activity-style 'bg=colour234,fg=colour154,nobold'
setw -g window-status-format '#{?window_activity_flag,#[bg=colour234,fg=colour177,nobold] #I#[bg=colour234,fg=colour249]:#[bg=colour234,fg=colour154]#W#[bg=colour234,fg=colour249]#F ,#[bg=colour234,fg=colour177,nobold] #I#[bg=colour234,fg=colour249]:#[bg=colour234,fg=colour255]#W#[bg=colour234,fg=colour249]#F }'
setw -g window-status-bell-style 'bg=colour234,fg=colour208,bold'

# messages, copy-mode selection, big clock (prefix+t) — all tmux-default yellow otherwise
set -g message-style 'bg=colour97,fg=colour231'
set -g mode-style 'bg=colour97,fg=colour154'
setw -g clock-mode-colour colour154
